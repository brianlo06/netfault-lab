name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release:
    name: Build and test (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends catch2 cmake ninja-build tcpdump
      - name: Configure TCP overflow behavior for the connect-timeout scenario
        run: |
          sudo sysctl -w net.ipv4.tcp_syncookies=0
          sudo sysctl -w net.ipv4.tcp_abort_on_overflow=0
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Test
        run: ctest --preset release --output-on-failure

  asan-ubsan:
